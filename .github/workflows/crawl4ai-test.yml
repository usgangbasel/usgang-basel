name: crawl4ai-test
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths: ["crawler/**", ".github/workflows/crawl4ai-test.yml"]
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: crawler/requirements.txt
      - name: Install
        run: |
          pip install -r crawler/requirements.txt
          python -m playwright install --with-deps chromium
      - name: Run test
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python crawler/test_crawl4ai.py
      - name: Publish results to branch test-results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B test-results
          git add -f results || true
          git commit -m "crawl4ai test results $(date -u +%Y-%m-%dT%H:%MZ)" || exit 0
          git push -f origin test-results
